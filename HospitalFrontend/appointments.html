<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="appointmentsTitle">
        إدارة المواعيد - MediCore HMS
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        /* =========================================================
           RESPONSIVE DESIGN
           هذه الأسطر مسؤولة عن جعل التصميم متجاوبًا مع جميع الشاشات
           ========================================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            overflow-x: hidden;
            font-family: 'Cairo', sans-serif;
        }

        .responsive-table {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .responsive-table table {
            min-width: 760px;
        }

        @media (max-width: 767px) {

            body {
                display: block !important;
            }

            .desktop-sidebar {
                width: 100% !important;
                min-height: auto !important;
            }

            .desktop-sidebar nav {
                display: flex;
                overflow-x: auto;
                gap: 6px;
                padding: 8px;
                -webkit-overflow-scrolling: touch;
            }

            .desktop-sidebar nav a {
                flex: 0 0 auto;
                white-space: nowrap;
            }

            .main-layout {
                width: 100% !important;
                min-width: 0 !important;
            }

            .responsive-header {
                padding: 12px 16px !important;
                flex-wrap: wrap;
            }

            .header-search {
                width: 100% !important;
                max-width: 100% !important;
                order: 2;
            }

            .responsive-main {
                padding: 16px !important;
            }
        }

    </style>
</head>


<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex text-sm">


    <!-- =========================================================
         SIDEBAR
         RESPONSIVE: يتحول إلى شريط أفقي على الجوال
         ========================================================= -->

    <aside class="desktop-sidebar w-64 bg-[#091E25] text-slate-300 flex flex-col justify-between shrink-0 min-h-screen">

        <div>

            <div class="p-5 flex items-center gap-3 border-b border-slate-800/60">

                <div class="w-8 h-8 bg-[#00A896] rounded-lg flex items-center justify-center text-white font-bold shrink-0">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <span class="text-lg font-bold text-white whitespace-nowrap">
                    MediCore HMS
                </span>

            </div>


            <nav class="p-3 space-y-1">

                <a href="dashboard.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">
                    <i class="fa-solid fa-chart-pie w-5 shrink-0"></i>
                    <span data-i18n="navDashboard">لوحة التحكم</span>
                </a>

                <a href="patients.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">
                    <i class="fa-solid fa-user-group w-5 shrink-0"></i>
                    <span data-i18n="navPatients">إدارة المرضى</span>
                </a>

                <a href="appointments.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#00A896] text-white font-semibold shadow-lg">
                    <i class="fa-regular fa-calendar-check w-5 shrink-0"></i>
                    <span data-i18n="navAppointments">المواعيد</span>
                </a>

                <a href="medical-records.html"
                   class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl">
                    <i class="fa-solid fa-file-medical w-5 shrink-0"></i>
                    <span data-i18n="navMedicalRecords">السجلات الطبية</span>
                </a>

                <a href="invoices.html"
                   class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl">
                    <i class="fa-solid fa-receipt w-5 shrink-0"></i>
                    <span data-i18n="navInvoices">الفواتير</span>
                </a>

                <a href="reports.html"
                   class="flex items-center gap-3 px-4 py-3 text-slate-400 hover:text-white hover:bg-slate-800/50 rounded-xl">
                    <i class="fa-solid fa-chart-line w-5 shrink-0"></i>
                    <span data-i18n="navReports">التقارير</span>
                </a>

                <a href="settings.html"
                   class="flex items-center gap-3 px-4 py-2.5 rounded-lg hover:bg-slate-800/60 transition">
                    <i class="fa-solid fa-gear w-5 shrink-0"></i>
                    <span data-i18n="navSettings">الإعدادات</span>
                </a>

            </nav>

        </div>

    </aside>


    <!-- MAIN -->

    <div class="main-layout flex-1 flex flex-col min-w-0 w-full">


        <!-- HEADER -->

        <header class="responsive-header bg-white border-b border-slate-200/80 px-8 py-3.5 flex items-center justify-between gap-4">

            <div class="header-search relative w-96 max-w-full">

                <input
                    type="text"
                    id="globalSearchInput"
                    placeholder="البحث عن مريض، موعد، أو طبيب..."
                    data-i18n-placeholder="searchPlaceholder"
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-9 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#00A896]/30">

                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>

            </div>


            <button
                id="langToggleBtn"
                onclick="toggleLanguage()"
                class="shrink-0 flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-xs font-semibold">

                <i class="fa-solid fa-globe text-[#00A896]"></i>

                <span id="currentLangLabel">
                    English
                </span>

            </button>

        </header>


        <!-- MAIN CONTENT -->

        <main class="responsive-main p-8 space-y-6 overflow-y-auto min-w-0 w-full">

            <div>

                <h1 class="text-2xl font-bold text-slate-900"
                    data-i18n="appointmentsHeader">
                    المواعيد والحجوزات
                </h1>

                <p class="text-xs text-slate-500 mt-1"
                   data-i18n="appointmentsSubHeader">
                    جدولة، بحث، وإدارة مواعيد العيادات الخارجية والعمليات بشكل لحظي.
                </p>

            </div>


            <!-- RESPONSIVE GRID
                 على الجوال عمود واحد
                 وعلى الشاشات الكبيرة جدول + نموذج -->

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 min-w-0">


                <!-- TABLE -->

                <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-6 shadow-sm space-y-4 min-w-0">

                    <div class="relative max-w-md w-full">

                        <input
                            type="text"
                            id="tableSearchInput"
                            placeholder="تصفية المواعيد حسب الاسم، القسم..."
                            data-i18n-placeholder="filterPlaceholder"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-9 py-2 text-xs">

                        <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>

                    </div>


                    <!-- RESPONSIVE TABLE
                         الجدول يسمح بالتمرير أفقيًا على الجوال بدل كسر الصفحة -->

                    <div class="responsive-table">

                        <table class="w-full border-collapse text-xs">

                            <thead>

                                <tr class="text-[11px] font-bold text-slate-400 border-b border-slate-100">

                                    <th class="pb-3 px-3">#</th>
                                    <th class="pb-3 px-3">المريض</th>
                                    <th class="pb-3 px-3">الطبيب</th>
                                    <th class="pb-3 px-3">القسم</th>
                                    <th class="pb-3 px-3">الموعد</th>
                                    <th class="pb-3 px-3">الحالة</th>
                                    <th class="pb-3 px-3 text-center">إجراءات</th>

                                </tr>

                            </thead>

                            <tbody
                                id="appointmentsTableBody"
                                class="text-xs divide-y divide-slate-100">
                            </tbody>

                        </table>

                    </div>

                </div>


                <!-- NEW APPOINTMENT -->

                <div class="bg-white rounded-2xl border border-slate-200/80 p-5 sm:p-6 shadow-sm h-fit space-y-4 min-w-0">

                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2 border-b border-slate-100 pb-3">

                        <i class="fa-regular fa-calendar-plus text-[#00A896]"></i>

                        <span data-i18n="newAppointmentTitle">
                            حجز موعد جديد
                        </span>

                    </h3>


                    <form id="appointmentForm" class="space-y-4">

                        <div>
                            <label class="block text-xs font-bold mb-1">
                                اسم المريض
                            </label>

                            <input
                                type="text"
                                id="patientName"
                                required
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">
                        </div>


                        <div>
                            <label class="block text-xs font-bold mb-1">
                                الطبيب المعالج
                            </label>

                            <input
                                type="text"
                                id="doctorName"
                                required
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">
                        </div>


                        <div>
                            <label class="block text-xs font-bold mb-1">
                                القسم / العيادة
                            </label>

                            <select
                                id="department"
                                required
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">

                                <option value="العيادة الباطنية">
                                    العيادة الباطنية
                                </option>

                                <option value="عيادة العظام">
                                    عيادة العظام
                                </option>

                                <option value="عيادة الأطفال">
                                    عيادة الأطفال
                                </option>

                                <option value="عيادة الأسنان">
                                    عيادة الأسنان
                                </option>

                            </select>

                        </div>


                        <div>

                            <label class="block text-xs font-bold mb-1">
                                تاريخ ووقت الموعد
                            </label>

                            <input
                                type="datetime-local"
                                id="appointmentDate"
                                dir="ltr"
                                required
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs">

                        </div>


                        <div>

                            <label class="block text-xs font-bold mb-1">
                                ملاحظات إضافية
                            </label>

                            <textarea
                                id="notes"
                                rows="2"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs"></textarea>

                        </div>


                        <button
                            type="submit"
                            class="w-full bg-[#00A896] hover:bg-[#008f80] text-white font-bold py-2.5 rounded-xl text-xs flex items-center justify-center gap-2">

                            <i class="fa-solid fa-plus"></i>

                            <span data-i18n="btnSubmitAppointment">
                                تأكيد وحفظ الموعد
                            </span>

                        </button>

                    </form>

                </div>

            </div>

        </main>

    </div>


    <script src="assets/js/config.js"></script>
    <script src="assets/js/appointments.js"></script>

</body>
</html>
