<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="loginTitle">تسجيل الدخول - MediCore HMS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Cairo & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8">
        
        <!-- زر تغيير اللغة -->
        <div class="flex justify-end mb-4">
            <button id="langToggleBtn" class="px-3 py-1.5 text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors flex items-center gap-1.5">
                <i class="fa-solid fa-globe"></i>
                <span id="langText">EN</span>
            </button>
        </div>

        <!-- الشعار وعنوان الصفحة -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-[#00A896] text-white rounded-xl shadow-md mb-3">
                <i class="fa-solid fa-heart-pulse text-xl"></i>
            </div>
            <h1 class="text-xl font-bold text-slate-900" data-i18n="authWelcomeBack">مرحباً بعودتك</h1>
            <p class="text-xs text-slate-500 mt-1" data-i18n="authLoginSub">أدخل بياناتك للوصول إلى نظام إدارة المستشفى.</p>
        </div>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm" class="space-y-4">
            <div>
                <label for="loginEmail" class="block text-xs font-semibold text-slate-700 mb-1" data-i18n="lblEmail">البريد الإلكتروني</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-regular fa-envelope"></i>
                    </span>
                    <input type="email" id="loginEmail" class="w-full pr-10 pl-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#00A896] focus:bg-white transition-all" placeholder="admin@medicore.io" required>
                </div>
            </div>

            <div>
                <label for="loginPassword" class="block text-xs font-semibold text-slate-700 mb-1" data-i18n="lblPassword">كلمة المرور</label>
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="loginPassword" class="w-full pr-10 pl-3 py-2.5 text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:border-[#00A896] focus:bg-white transition-all" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="w-full py-2.5 bg-[#00A896] hover:bg-[#008f80] text-white text-sm font-semibold rounded-xl shadow-lg shadow-[#00A896]/20 transition-all mt-2" data-i18n="btnLoginSubmit">
                تسجيل الدخول
            </button>
        </form>

        <!-- رابط إنشاء حساب -->
        <div class="text-center mt-6 pt-4 border-t border-slate-100">
            <span class="text-xs text-slate-500" data-i18n="noAccount">ليس لديك حساب؟</span>
            <a href="register.html" class="text-xs font-bold text-[#00A896] hover:underline ms-1" data-i18n="linkRegister">إنشاء حساب جديد</a>
        </div>

    </div>

    <!-- ملفات الجافاسكريبت -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>
</body>
</html>
