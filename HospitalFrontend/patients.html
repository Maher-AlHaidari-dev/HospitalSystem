<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlTag">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-i18n="patients.title">
        إدارة المرضى - MediCore HMS
    </title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Responsive CSS المشترك لجميع الصفحات -->
    <link rel="stylesheet" href="assets/css/resp_d.css">

    <style>
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
        }
    </style>
</head>


<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex text-sm">


    <!-- =========================================================
         SIDEBAR
         ========================================================= -->

    <aside class="desktop-sidebar w-64 bg-[#091E25] text-slate-300 flex flex-col justify-between shrink-0 min-h-screen">

        <div>

            <!-- Logo -->

            <div class="p-5 flex items-center gap-3 border-b border-slate-800/60">

                <div class="w-8 h-8 bg-[#00A896] rounded-lg flex items-center justify-center text-white font-bold shrink-0">
                    <i class="fa-solid fa-heart-pulse"></i>
                </div>

                <span class="text-lg font-bold text-white whitespace-nowrap">
                    MediCore HMS
                </span>

            </div>


            <!-- Navigation -->

            <nav class="p-3 space-y-1">

                <!-- Dashboard -->

                <a href="dashboard.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">

                    <i class="fa-solid fa-chart-pie w-5 text-center shrink-0"></i>

                    <span data-i18n="nav.dashboard">
                        لوحة التحكم
                    </span>

                </a>


                <!-- Patients - Active -->

                <a href="patients.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl bg-[#00A896] text-white font-semibold shadow-lg shadow-[#00A896]/20">

                    <i class="fa-solid fa-user-group w-5 text-center shrink-0"></i>

                    <span data-i18n="nav.patients">
                        إدارة المرضى
                    </span>

                </a>


                <!-- Appointments -->

                <a href="appointments.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">

                    <i class="fa-regular fa-calendar-check w-5 text-center shrink-0"></i>

                    <span data-i18n="nav.appointments">
                        المواعيد
                    </span>

                </a>


                <!-- Medical Records -->

                <a href="medical-records.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">

                    <i class="fa-solid fa-file-medical w-5 text-center shrink-0"></i>

                    <span data-i18n="nav.medicalRecords">
                        السجلات الطبية
                    </span>

                </a>


                <!-- Invoices -->

                <a href="invoices.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">

                    <i class="fa-solid fa-receipt w-5 text-center shrink-0"></i>

                    <span data-i18n="nav.invoices">
                        الفواتير
                    </span>

                </a>


                <!-- Reports -->

                <a href="reports.html"
                   class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">

                    <i class="fa-solid fa-chart-line w-5 text-center shrink-0"></i>

                    <span data-i18n="nav.reports">
                        التقارير
                    </span>

                </a>


                <!-- Settings -->

                <a href="settings.html"
                   class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800/50 transition">

                    <i class="fa-solid fa-gear w-5 text-center shrink-0"></i>

                    <span data-i18n="nav.settings">
                        الإعدادات
                    </span>

                </a>

            </nav>

        </div>


        <!-- User Profile -->

        <div class="p-4 border-t border-slate-800/60 flex items-center justify-between">

            <div class="flex items-center gap-3">

                <div class="w-9 h-9 rounded-full bg-[#00A896]/20 border border-[#00A896]/40 text-[#00A896] flex items-center justify-center font-bold">
                    <i class="fa-solid fa-user-shield"></i>
                </div>

                <div>

                    <p class="text-[10px] text-slate-400"
                       data-i18n="user.role">
                        إدارة النظام
                    </p>

                </div>

            </div>


            <button
                type="button"
                class="text-slate-400 hover:text-red-400 transition"
                title="تسجيل الخروج"
                data-i18n-title="logout">

                <i class="fa-solid fa-arrow-right-from-bracket"></i>

            </button>

        </div>

    </aside>



    <!-- =========================================================
         MAIN LAYOUT
         ========================================================= -->

    <div class="main-layout flex-1 flex flex-col min-w-0 w-full">


        <!-- =====================================================
             HEADER
             ===================================================== -->

        <header class="responsive-header bg-white border-b border-slate-200/80 px-8 py-3.5 flex items-center justify-between gap-4">


            <!-- Global Search -->

            <div class="header-search relative w-96 max-w-full">

                <input
                    type="text"
                    id="globalSearchInput"
                    data-i18n-placeholder="header.searchPlaceholder"
                    placeholder="البحث عن مريض بالاسم، البريد أو المعرّف (PID)..."
                    class="w-full bg-slate-50 border border-slate-200 rounded-xl px-9 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#00A896]/30 focus:border-[#00A896] transition">

                <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>

            </div>


            <!-- Header Actions -->

            <div class="flex items-center gap-3 shrink-0">


                <!-- Language -->

                <button
                    id="langToggleBtn"
                    type="button"
                    onclick="toggleLanguage()"
                    class="shrink-0 flex items-center gap-2 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-xl text-xs font-semibold transition">

                    <i class="fa-solid fa-globe text-[#00A896]"></i>

                    <span id="currentLangLabel">
                        English
                    </span>

                </button>


                <!-- Notifications -->

                <button
                    type="button"
                    class="w-9 h-9 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-center text-slate-600 hover:bg-slate-100 relative transition">

                    <i class="fa-regular fa-bell text-sm"></i>

                    <span class="w-2 h-2 bg-rose-500 rounded-full absolute top-2 left-2"></span>

                </button>

            </div>

        </header>



        <!-- =====================================================
             MAIN CONTENT
             ===================================================== -->

        <main class="responsive-main p-8 space-y-6 overflow-y-auto min-w-0 w-full">


            <!-- Page Title + Action -->

            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">

                <div>

                    <h1
                        class="text-2xl font-bold text-slate-900"
                        data-i18n="patients.title">

                        سجلات المرضى

                    </h1>


                    <p
                        class="text-xs text-slate-500 mt-1"
                        data-i18n="patients.subtitle">

                        تسجيل، تصفية، ومتابعة الملفات الطبية الشاملة لكافة المرضى.

                    </p>

                </div>


                <!-- Register Patient -->

                <button
                    id="toggleFormBtn"
                    type="button"
                    class="bg-[#00A896] hover:bg-[#008f80] text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow-md shadow-[#00A896]/20 transition flex items-center justify-center gap-2 cursor-pointer">

                    <i class="fa-solid fa-user-plus text-[11px]"></i>

                    <span
                        id="toggleBtnText"
                        data-i18n="patients.btnRegister">

                        تسجيل مريض جديد

                    </span>

                </button>

            </div>



            <!-- =================================================
                 NEW PATIENT FORM
                 ================================================= -->

            <div
                id="patientFormCard"
                class="bg-white rounded-2xl border border-slate-200/80 p-5 sm:p-6 shadow-sm hidden space-y-5 transition-all">


                <!-- Form Header -->

                <div class="flex items-center justify-between border-b border-slate-100 pb-3">

                    <h3 class="font-bold text-slate-800 text-sm flex items-center gap-2">

                        <i class="fa-solid fa-address-card text-[#00A896]"></i>

                        <span data-i18n="form.header">
                            نموذج تسجيل مريض جديد
                        </span>

                    </h3>

                    <span class="w-2.5 h-2.5 rounded-full bg-[#00A896]"></span>

                </div>



                <form id="patientForm" class="space-y-4">


                    <!-- Name + DOB -->

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <div>

                            <label
                                for="fullName"
                                class="block text-xs font-bold text-slate-700 mb-1"
                                data-i18n="form.fullName">

                                الاسم الكامل *

                            </label>

                            <input
                                type="text"
                                id="fullName"
                                required
                                data-i18n-placeholder="form.fullNamePlaceholder"
                                placeholder="مثال: أحمد السيد"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                        </div>


                        <div>

                            <label
                                for="dateOfBirth"
                                class="block text-xs font-bold text-slate-700 mb-1"
                                data-i18n="form.dob">

                                تاريخ الميلاد *

                            </label>

                            <input
                                type="date"
                                id="dateOfBirth"
                                required
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                        </div>

                    </div>



                    <!-- Gender + Contact -->

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <div>

                            <label
                                for="gender"
                                class="block text-xs font-bold text-slate-700 mb-1"
                                data-i18n="form.gender">

                                الجنس *

                            </label>

                            <select
                                id="gender"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                                <option value="ذكر" data-i18n="gender.male">
                                    ذكر
                                </option>

                                <option value="أنثى" data-i18n="gender.female">
                                    أنثى
                                </option>

                            </select>

                        </div>


                        <div>

                            <label
                                for="contactNumber"
                                class="block text-xs font-bold text-slate-700 mb-1"
                                data-i18n="form.contact">

                                رقم التواصل *

                            </label>

                            <input
                                type="tel"
                                id="contactNumber"
                                required
                                data-i18n-placeholder="form.contactPlaceholder"
                                placeholder="+967 7XX XXX XXX"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                        </div>

                    </div>



                    <!-- Email + Status -->

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                        <div>

                            <label
                                for="email"
                                class="block text-xs font-bold text-slate-700 mb-1"
                                data-i18n="form.email">

                                البريد الإلكتروني

                            </label>

                            <input
                                type="email"
                                id="email"
                                data-i18n-placeholder="form.emailPlaceholder"
                                placeholder="patient@example.com"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                        </div>


                        <div>

                            <label
                                for="status"
                                class="block text-xs font-bold text-slate-700 mb-1"
                                data-i18n="form.status">

                                الحالة

                            </label>

                            <select
                                id="status"
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                                <option value="نشط" data-i18n="status.active">
                                    نشط
                                </option>

                                <option value="غير نشط" data-i18n="status.inactive">
                                    غير نشط
                                </option>

                            </select>

                        </div>

                    </div>



                    <!-- Address -->

                    <div>

                        <label
                            for="address"
                            class="block text-xs font-bold text-slate-700 mb-1"
                            data-i18n="form.address">

                            العنوان

                        </label>

                        <input
                            type="text"
                            id="address"
                            data-i18n-placeholder="form.addressPlaceholder"
                            placeholder="المدينة، الدولة"
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                    </div>



                    <!-- Medical History -->

                    <div>

                        <label
                            for="medicalHistory"
                            class="block text-xs font-bold text-slate-700 mb-1"
                            data-i18n="form.medicalHistory">

                            السجل الطبي

                        </label>

                        <textarea
                            id="medicalHistory"
                            rows="2"
                            data-i18n-placeholder="form.historyPlaceholder"
                            placeholder="الحساسية، الأمراض المزمنة، العمليات السابقة..."
                            class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2 text-xs focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition"></textarea>

                    </div>



                    <!-- Form Actions -->

                    <div class="pt-2 flex items-center justify-end gap-3">

                        <button
                            type="button"
                            id="cancelFormBtn"
                            class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold px-4 py-2 rounded-xl text-xs transition cursor-pointer"
                            data-i18n="form.cancel">

                            إلغاء

                        </button>


                        <button
                            type="submit"
                            class="bg-[#00A896] hover:bg-[#008f80] text-white font-bold px-6 py-2 rounded-xl text-xs shadow-md shadow-[#00A896]/20 transition flex items-center gap-2 cursor-pointer">

                            <i class="fa-solid fa-check text-[10px]"></i>

                            <span data-i18n="form.save">
                                حفظ بيانات المريض
                            </span>

                        </button>

                    </div>

                </form>

            </div>



            <!-- =================================================
                 PATIENTS TABLE
                 ================================================= -->

            <div class="bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-6 shadow-sm space-y-4 min-w-0">


                <!-- Search -->

                <div class="relative max-w-md w-full">

                    <input
                        type="text"
                        id="tableSearchInput"
                        data-i18n-placeholder="table.filterPlaceholder"
                        placeholder="البحث باسم المريض، PID، أو رقم التواصل..."
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-9 py-2 text-xs focus:outline-none focus:ring-2 focus:ring-[#00A896]/20 focus:border-[#00A896] transition">

                    <i class="fa-solid fa-magnifying-glass absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs pointer-events-none"></i>

                </div>



                <!-- Responsive Table -->

                <div class="responsive-table">

                    <table class="w-full border-collapse text-xs">

                        <thead>

                            <tr class="text-[11px] font-bold text-slate-400 border-b border-slate-100">

                                <th class="pb-3 px-3 whitespace-nowrap"
                                    data-i18n="table.pid">
                                    Patient ID
                                </th>

                                <th class="pb-3 px-3 whitespace-nowrap"
                                    data-i18n="table.name">
                                    Name
                                </th>

                                <th class="pb-3 px-3 whitespace-nowrap"
                                    data-i18n="table.ageGender">
                                    Age / Gender
                                </th>

                                <th class="pb-3 px-3 whitespace-nowrap"
                                    data-i18n="table.contact">
                                    Contact
                                </th>

                                <th class="pb-3 px-3 whitespace-nowrap"
                                    data-i18n="table.registered">
                                    Registered
                                </th>

                                <th class="pb-3 px-3 whitespace-nowrap"
                                    data-i18n="table.status">
                                    Status
                                </th>

                                <th class="pb-3 px-3 text-center whitespace-nowrap"
                                    data-i18n="table.actions">
                                    Actions
                                </th>

                            </tr>

                        </thead>


                        <tbody
                            id="patientsTableBody"
                            class="text-xs divide-y divide-slate-100">

                            <!-- يتم توليد المرضى بواسطة patients.js -->

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>



    <!-- =========================================================
         JAVASCRIPT
         ========================================================= -->

    <!-- ملف الترجمة والإعدادات -->
    <script src="assets/js/config.js"></script>

    <!-- منطق صفحة المرضى -->
    <script src="assets/js/patients.js"></script>

</body>
</html>
