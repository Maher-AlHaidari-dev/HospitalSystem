<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="medicalRecordsTitle">السجلات الطبية - MediCore HMS</title>
    <link rel="stylesheet" href="assets/css/style.css"> <!-- استبدل بمسار ملف الـ CSS الخاص بك -->
</head>
<body>

    <div class="app-container">
        <!-- Main Content Header -->
        <header class="content-header">
            <div>
                <h1 data-i18n="recordsHeader">السجلات الطبية</h1>
                <p data-i18n="recordsSubHeader">سجلات المرضى المركزية والمؤرخة مع صلاحيات الوصول والتدقيق الشامل.</p>
            </div>
            <div class="header-actions">
                <button id="btnOpenNewRecordModal" class="btn-primary" data-i18n="btnNewRecord">سجل جديد</button>
            </div>
        </header>

        <!-- Search & Filter bar -->
        <div class="filter-bar">
            <input type="text" id="searchInput" data-i18n-placeholder="searchPlaceholder" placeholder="البحث عن مريض، موعد، أو طبيب...">
        </div>

        <!-- Records Table Section -->
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th data-i18n="thPatientName">اسم المريض</th>
                        <th data-i18n="recordsDiagnosis">التشخيص</th>
                        <th data-i18n="recordsPrescription">الوصفة الطبية</th>
                        <th data-i18n="recordsNotes">ملاحظات</th>
                        <th data-i18n="thActions">إجراءات</th>
                    </tr>
                </thead>
                <tbody id="medicalRecordsTableBody">
                    <tr>
                        <td colspan="5" style="text-align: center;" data-i18n="loadingRecords">جاري تحميل السجلات الطبية...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for New Record (Hidden by default) -->
    <div id="newRecordModal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3 data-i18n="modalNewRecordTitle">إضافة سجل طبي جديد</h3>
            <form id="newRecordForm">
                <div class="form-group">
                    <label data-i18n="lblPatientName">اسم المريض</label>
                    <input type="text" id="recordPatientName" required>
                </div>
                <div class="form-group">
                    <label data-i18n="recordsDiagnosis">التشخيص</label>
                    <input type="text" id="recordDiagnosis" required>
                </div>
                <div class="form-group">
                    <label data-i18n="recordsPrescription">الوصفة الطبية</label>
                    <textarea id="recordPrescription"></textarea>
                </div>
                <div class="form-group">
                    <label data-i18n="recordsNotes">ملاحظات</label>
                    <textarea id="recordNotes"></textarea>
                </div>
                <button type="submit" class="btn-primary" data-i18n="btnSaveRecord">حفظ السجل</button>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="medical-records.js"></script>
</body>
</html>
