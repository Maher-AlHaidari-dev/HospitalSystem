<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="settingsTitle">MediCore HMS - Settings</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
     <link rel="stylesheet" href="assets/css/resp_d.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased selection:bg-teal-500 selection:text-white">

    <div class="flex min-h-screen">
        <!-- Sidebar Navigation -->
        <aside class="desktop-sidebar w-64 bg-[#091E25] text-slate-300 flex flex-col justify-between shrink-0 min-h-screen">
            <div>
                <!-- Brand Header -->
                <div class="h-16 flex items-center px-6 space-x-3 space-x-reverse border-b border-slate-700/50">
                    <div class="w-8 h-8 rounded-lg bg-teal-500 flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-heart-pulse"></i>
                    </div>
                    <span class="font-bold text-white text-lg tracking-wide">MediCore HMS</span>
                </div>

                <!-- Navigation Links -->
                <nav class="p-4 space-y-1 text-sm font-medium">
                    <a href="dashboard.html" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800/60 transition">
                        <i class="fa-solid fa-border-all w-6 text-slate-400"></i>
                        <span data-i18n="navDashboard">Dashboard</span>
                    </a>
                    <a href="patients.html" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800/60 transition">
                        <i class="fa-solid fa-user-group w-6 text-slate-400"></i>
                        <span data-i18n="navPatients">Patients</span>
                    </a>
                    <a href="appointments.html" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800/60 transition">
                        <i class="fa-solid fa-calendar-check w-6 text-slate-400"></i>
                        <span data-i18n="navAppointments">Appointments</span>
                    </a>
                    <a href="medical-records.html" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800/60 transition">
                        <i class="fa-solid fa-file-medical w-6 text-slate-400"></i>
                        <span data-i18n="navMedicalRecords">Medical Records</span>
                    </a>
                    <a href="invoices.html" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800/60 transition">
                        <i class="fa-solid fa-receipt w-6 text-slate-400"></i>
                        <span data-i18n="navInvoices">Billing</span>
                    </a>
                    <a href="reports.html" class="flex items-center px-4 py-2.5 rounded-lg hover:bg-slate-800/60 transition">
                        <i class="fa-solid fa-chart-line w-6 text-slate-400"></i>
                        <span data-i18n="navReports">Reports</span>
                    </a>
                    <a href="settings.html" class="flex items-center px-4 py-2.5 rounded-lg bg-teal-600/90 text-white font-semibold shadow-sm">
                        <i class="fa-solid fa-gear w-6"></i>
                        <span data-i18n="navSettings">Settings</span>
                    </a>
                </nav>
            </div>

            <!-- User Profile Footer -->
            <div class="p-4 border-t border-slate-700/50 flex items-center justify-between">
                <div class="flex items-center space-x-3 space-x-reverse overflow-hidden">
                    <div class="w-9 h-9 rounded-full bg-teal-500/20 text-teal-400 flex items-center justify-center font-bold text-sm shrink-0">
                        A
                    </div>
                    <div class="truncate text-xs">
                        <p class="font-semibold text-white truncate">Admin</p>
                        <p class="text-slate-400 truncate" data-i18n="adminRole">System Admin</p>
                    </div>
                </div>
                <button title="Logout" class="text-slate-400 hover:text-white transition p-1.5">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0">
            <!-- Top Navbar -->
            <header class="h-16 bg-white border-b border-slate-200 px-8 flex items-center justify-between gap-4">
                <div class="relative max-w-md w-full">
                    <i class="fa-solid fa-magnifying-glass absolute rtl:right-3.5 ltr:left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Search patients, appointments..." class="w-full rtl:pr-10 rtl:pl-4 ltr:pl-10 ltr:pr-4 py-2 text-sm bg-slate-100/80 border border-transparent rounded-lg focus:bg-white focus:border-teal-500 focus:outline-none transition">
                </div>

                <div class="flex items-center space-x-3 space-x-reverse">
                    <button id="langToggleBtn" onclick="toggleLanguage()" class="px-3 py-1.5 text-xs font-semibold text-slate-600 border border-slate-200 rounded-lg hover:bg-slate-50 transition">
                        EN
                    </button>
                    <button class="relative p-2 text-slate-500 hover:text-slate-700 transition rounded-lg hover:bg-slate-100">
                        <i class="fa-regular fa-bell"></i>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-rose-500 rounded-full"></span>
                    </button>
                </div>
            </header>

            <!-- Page Body -->
            <div class="p-8 max-w-5xl w-full mx-auto space-y-6">
                <!-- Page Title -->
                <div>
                    <h1 class="text-2xl font-bold text-slate-900" data-i18n="settingsHeader">Settings</h1>
                    <p class="text-xs text-slate-500 mt-1" data-i18n="settingsSubHeader">Manage your profile, notifications, and workspace preferences.</p>
                </div>

                <!-- Profile Settings Card -->
                <div class="bg-white rounded-xl border border-slate-200/80 p-6 shadow-sm space-y-6">
                    <h2 class="text-sm font-bold text-slate-800" data-i18n="sectionProfile">Profile</h2>
                    
                    <form id="profileForm" onsubmit="handleSaveSettings(event)" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1.5" data-i18n="lblName">Name</label>
                                <input type="text" id="adminName" value="Admin" required class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-teal-500 text-slate-700 bg-slate-50/30">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1.5" data-i18n="lblEmail">Email</label>
                                <input type="email" id="adminEmail" value="admin@medicore.io" required class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg focus:outline-none focus:border-teal-500 text-slate-700 bg-slate-50/30">
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1.5" data-i18n="lblRole">Role</label>
                            <input type="text" id="adminRoleInput" value="Admin Staff" disabled class="w-full px-3.5 py-2 text-sm border border-slate-200 rounded-lg bg-slate-50 text-slate-500 cursor-not-allowed">
                        </div>

                        <div class="flex justify-end pt-2">
                            <button type="submit" class="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold rounded-lg shadow-sm transition" data-i18n="btnSave">
                                Save changes
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Notifications Card -->
                <div class="bg-white rounded-xl border border-slate-200/80 p-6 shadow-sm space-y-4">
                    <h2 class="text-sm font-bold text-slate-800" data-i18n="sectionNotifications">Notifications</h2>
                    
                    <div class="flex items-center justify-between pt-2">
                        <div>
                            <p class="text-xs font-semibold text-slate-800" data-i18n="lblAppointmentReminders">Appointment reminders</p>
                            <p class="text-[11px] text-slate-400 mt-0.5" data-i18n="subAppointmentReminders">Send Email + SMS reminders to patients.</p>
                        </div>
                        
                        <!-- Toggle Switch -->
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="reminderToggle" checked onchange="toggleReminders(this.checked)" class="sr-only peer">
                            <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-teal-600"></div>
                        </label>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Configuration & Page Logic Scripts -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/settings.js"></script>
</body>
</html>
